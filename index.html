<!DOCTYPE html>
<html lang="es">
<head>

<style>
:root{--onacc:#1a1408;--bg:#121212;--card:#1c1c1f;--card2:#25252a;--line:#303036;--txt:#f3f3f3;--mut:#9b9ba4;--acc:#e3a33b;--acc2:#f0bd62;--ok:#3fb871;--bad:#e5534b;--blue:#4a9eff;--wa:#25d366}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;max-width:640px;margin:0 auto}
.logo{flex:none;display:flex}
[data-ic]{display:inline-flex}
svg.i{width:1em;height:1em;flex:none}
.brand h1{font-size:18px;font-weight:700;line-height:1.15}
.brand small{display:block;color:var(--mut);font-size:12px;font-weight:400}
main{padding:12px 14px 20px;max-width:640px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0 10px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button .t{font-size:23px;line-height:1;margin-bottom:2px}
nav.tabs button.on{color:var(--acc)}
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.daynav .arrow{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer}
.daynav .mid{flex:1;text-align:center;position:relative}
.daynav .mid strong{display:block;font-size:17px}
.daynav .mid strong::first-letter{text-transform:uppercase}
.daynav .mid span{font-size:12px;color:var(--mut)}
.daynav .pick{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chip{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:600}
.resumen{display:flex;gap:8px;margin-bottom:12px}
.resumen div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.resumen b{display:block;font-size:17px}
.resumen span{font-size:12px;color:var(--mut)}
.libre{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;color:var(--mut);cursor:pointer}
.libre .h{font-variant-numeric:tabular-nums;width:46px;color:var(--txt);opacity:.75}
.libre .plus{margin-left:auto;color:var(--acc);font-size:20px;line-height:1}
.cita{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.cita.c{border-left-color:var(--blue)}.cita.a{border-left-color:var(--ok);opacity:.8}.cita.n{border-left-color:var(--bad);opacity:.6}
.cita .top{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.cita .h{font-weight:700;font-variant-numeric:tabular-nums;width:46px;flex:none}
.cita .info{flex:1;min-width:0}
.cita .info b{display:block;font-size:16px}
.cita .info small{color:var(--mut);font-size:13px}
.cita .nota{font-size:13px;color:var(--acc2);margin-top:3px}
.pill{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--card2);white-space:nowrap;flex:none}
.pill.p{color:var(--acc2)}.pill.c{color:var(--blue)}.pill.a{color:var(--ok)}.pill.n{color:var(--bad)}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.acts a,.acts button{display:inline-flex;align-items:center;justify-content:center;gap:5px;flex:1;min-width:70px;text-align:center;text-decoration:none;font-size:13px;padding:8px 6px;border-radius:9px;border:1px solid var(--line);background:var(--card2);cursor:pointer;color:var(--txt)}
.acts .wa{background:rgba(37,211,102,.14);border-color:rgba(37,211,102,.4);color:#7be3a4}
.vacio{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--mut);line-height:1.45;margin-bottom:12px}
.vacio b{color:var(--txt)}
.fab{display:flex;align-items:center;justify-content:center;position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;border:0;background:var(--acc);color:var(--onacc);font-size:30px;box-shadow:0 6px 20px rgba(0,0,0,.45);cursor:pointer;z-index:4}
h2{font-size:15px;color:var(--mut);font-weight:600;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.04em}
h2:first-child{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:10px}
input,select,textarea{display:block;width:100%;margin-top:4px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-size:16px;color:var(--txt)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
textarea{min-height:92px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;gap:8px;margin-top:6px}
.btn{flex:1;padding:12px;border-radius:11px;border:1px solid var(--line);background:var(--card2);cursor:pointer;font-weight:600;font-size:15px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.danger{color:var(--bad)}
.btn.sm{flex:none;padding:8px 12px;font-size:14px}
.srow{display:grid;grid-template-columns:1fr 92px 78px 38px;gap:6px;align-items:center;margin-bottom:8px}
.srow input,.srow select{margin:0;padding:9px 8px;font-size:15px}
.brow{display:grid;grid-template-columns:1fr 38px;gap:6px;margin-bottom:8px}
.brow input{margin:0}
.x{width:38px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--bad);cursor:pointer;font-size:18px}
.hint{font-size:12px;color:var(--mut);line-height:1.4;margin-top:-4px;margin-bottom:10px}
.cli{display:flex;gap:10px;align-items:center}
.cli .info{flex:1;min-width:0}
.cli .info b{display:block}
.cli .info small{color:var(--mut);font-size:13px}
.sellos{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap;align-items:center}
.sellos i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--acc);display:inline-block}
.sellos i.f{background:var(--acc)}
.premio{font-size:12px;color:var(--acc2);margin-left:6px;display:inline-flex;align-items:center;gap:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px}
.linkta{font-size:12px;min-height:64px;color:var(--mut);margin-bottom:10px;resize:none}
.share{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sbtn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);text-decoration:none;font-size:12px;cursor:pointer}
.sbtn svg{font-size:22px}
.sbtn.wa{color:#7be3a4}.sbtn.tg{color:#6cc4ff}.sbtn.fb{color:#7ea7ff}.sbtn.ig{color:#f08ab8}
.qrwrap{text-align:center}
#qr{display:inline-block;background:#fff;padding:12px;border-radius:12px;min-height:40px}
#qr img,#qr canvas{display:block;width:230px;height:230px}
.linkbox{background:var(--card2);border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:12px;color:var(--mut);word-break:break-all;max-height:64px;overflow:hidden;margin-bottom:10px}
.dias{display:flex;gap:6px;margin:4px 0 12px}
.dias button{flex:1;padding:9px 0;border-radius:9px;border:1px solid var(--line);background:var(--card2);cursor:pointer;font-size:13px}
.dias button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:700}
.sol{background:var(--card2);border-radius:12px;padding:12px;margin-bottom:12px}
.sol div{display:flex;justify-content:space-between;padding:5px 0;font-size:15px}
.sol span{color:var(--mut)}
.cerrado{display:flex;align-items:center;gap:8px;color:var(--acc2);font-size:14px;margin-bottom:10px}
.vacio .ico{font-size:30px;color:var(--acc);display:flex;justify-content:center;margin-bottom:6px}
.big{font-size:32px;font-weight:700;color:var(--acc2)}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.kpis div{background:var(--card2);border-radius:10px;padding:8px}
.kpis b{display:block;font-size:17px}
.kpis span{font-size:11px;color:var(--mut)}
.linea{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.linea:first-of-type{border-top:0}
.linea span{color:var(--mut)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
#modal .sheet{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#modal h3{font-size:18px;margin-bottom:14px}
#modal p{color:var(--mut);margin-bottom:12px;line-height:1.4}
.warn{color:var(--acc2)!important;font-size:14px;min-height:0}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--txt);color:var(--bg);border:0;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.banner{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;cursor:pointer;border:1px solid}
.banner.info{background:rgba(227,163,59,.12);border-color:rgba(227,163,59,.4);color:var(--acc2)}
.banner.mal{background:rgba(229,83,75,.12);border-color:rgba(229,83,75,.45);color:#ff9d97}
.banner b{color:var(--txt)}
#bloqueo{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;align-items:center;justify-content:center;padding:24px}
#bloqueo.on{display:flex}
#bloqueo .box{max-width:420px;width:100%;text-align:center}
#bloqueo h2{font-size:22px;color:var(--txt);text-transform:none;letter-spacing:0;margin:14px 0 8px}
#bloqueo p{color:var(--mut);line-height:1.5;margin-bottom:14px}
.plan{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.plan b{font-size:18px}
.tag{font-size:12px;padding:4px 10px;border-radius:99px;font-weight:600}
.tag.prueba{background:rgba(74,158,255,.15);color:#7fb8ff}.tag.pagado{background:rgba(63,184,113,.15);color:#7be3a4}.tag.vencido,.tag.bloqueado{background:rgba(229,83,75,.15);color:#ff9d97}
.temas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tema{border:2px solid var(--line);border-radius:14px;padding:8px;cursor:pointer;background:none;text-align:left}
.tema.on{border-color:var(--acc)}
.tema .mini{height:54px;border-radius:9px;padding:7px;display:flex;flex-direction:column;gap:5px}
.tema .mini i{display:block;height:8px;border-radius:4px}
.tema small{display:block;font-size:11px;margin-top:6px;color:var(--mut);font-weight:600}
.hoyres{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 22%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--acc) 40%,var(--line));border-radius:16px;padding:12px 14px;margin-bottom:12px}
.hoyres .n{font-size:26px;font-weight:800;color:var(--acc2);min-width:34px;text-align:center}
[data-claro="1"] .hoyres .n{color:var(--acc)}
.hoyres b{display:block;font-size:15px}
.hoyres small{color:var(--mut);font-size:13px}
.badge-enlace{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc2);margin-left:6px;vertical-align:middle}
[data-claro="1"] .badge-enlace{color:var(--acc)}
[data-claro="1"] .acts .wa,[data-claro="1"] .sbtn.wa{color:#1d8a4b}
[data-claro="1"] .pill.p{color:#a26a00}
.cita{border-radius:14px}.card{border-radius:16px}
h1,h2,h3,b,strong{letter-spacing:-.01em}
.sync{font-size:12px;color:var(--mut);text-align:center;margin-top:16px}
</style>
<style>/* Guía de bienvenida */
#guia{position:fixed;inset:0;z-index:45;display:none;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 22px calc(20px + env(safe-area-inset-bottom));
  background:radial-gradient(120% 70% at 50% 0%,color-mix(in srgb,var(--acc) 20%,transparent),transparent 60%),var(--bg)}
#guia.on{display:flex}

.gu-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);font-family:var(--cond,inherit);text-transform:uppercase;letter-spacing:.1em}
.gu-top button{background:none;border:0;color:var(--mut);font:inherit;cursor:pointer;padding:8px 0}

  background:var(--oro,linear-gradient(135deg,#f0cf86,#c9963f));box-shadow:0 0 0 6px var(--bg),0 0 0 7px color-mix(in srgb,var(--acc) 60%,transparent),0 16px 40px color-mix(in srgb,var(--acc) 40%,transparent)}
.gu-ic svg{width:46px;height:46px}
.gu-body h2{font-family:var(--serif,Georgia,serif);font-size:30px;text-align:center;margin:0 0 10px;text-transform:none;letter-spacing:0;color:var(--txt);display:block}
.gu-body h2::after{display:none}
.gu-body>p{text-align:center;color:var(--mut);line-height:1.5;margin:0 0 24px;font-size:15.5px}
.gu-list{display:flex;flex-direction:column;gap:10px}
.gu-list div{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:14.5px;box-shadow:var(--brillo,none)}
.gu-list span{width:36px;height:36px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--acc2);
  background:color-mix(in srgb,var(--acc) 14%,var(--card2));border:1px solid color-mix(in srgb,var(--acc) 35%,transparent)}
.gu-bot{max-width:460px;margin:0 auto;width:100%}
.gu-dots{display:flex;justify-content:center;gap:7px;margin:18px 0 14px}
.gu-dots i{width:8px;height:8px;border-radius:99px;background:var(--line);transition:width .25s,background .25s}
.gu-dots i.on{width:26px;background:var(--acc)}
.gu-bot .btn{padding:15px}
</style>

<script>
(function(){
"use strict";
const KEY='silla_v1';
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoy=()=>ymd(new Date());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const toMin=h=>{const[a,b]=(h||'0:0').split(':').map(Number);return a*60+(b||0)};
const toHH=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const clp=n=>'$'+Math.round(n||0).toLocaleString('es-CL');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fechaLarga=s=>parse(s).toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'});
const fechaCorta=s=>parse(s).toLocaleDateString('es-CL',{day:'numeric',month:'short'});
const mes=f=>'mes-'+f.slice(0,7);

const BASE=location.href.split('#')[0].split('?')[0];
const SILLA_URL=BASE.replace(/index\.html$/,'');
const RESERVA_URL=new URL('reserva.html',BASE).href;
const hex=s=>Array.from(new TextEncoder().encode(s)).map(b=>b.toString(16).padStart(2,'0')).join('');
const unhex=h=>new TextDecoder().decode(new Uint8Array((h.match(/../g)||[]).map(x=>parseInt(x,16))));
const P={
  cal:'<rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><circle cx="8" cy="14" r=".6" fill="currentColor"/><circle cx="12" cy="14" r=".6" fill="currentColor"/><circle cx="16" cy="14" r=".6" fill="currentColor"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/>',
  cash:'<rect x="2.5" y="6" width="19" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/>',
  sliders:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  wa:'<path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4A8 8 0 1 1 20 11.5z"/><path d="M9 9.5c.3 1.8 1.7 3.6 3.6 4.6l1.1-1 1.8.8"/>',

const POLE='<svg width="38" height="38" viewBox="0 0 44 44" aria-hidden="true"><defs><clipPath id="pc"><rect x="15" y="8" width="14" height="28" rx="3"/></clipPath></defs><rect width="44" height="44" rx="12" fill="#1c1c1f" stroke="#303036"/><g clip-path="url(#pc)"><rect x="15" y="8" width="14" height="28" fill="#f3f3f3"/><g stroke-width="5"><path d="M8 18 36 4M8 30 36 16M8 42 36 28" stroke="#e5534b"/><path d="M8 24 36 10M8 36 36 22" stroke="#4a9eff"/></g></g><rect x="13" y="5" width="18" height="4" rx="2" fill="#e3a33b"/><rect x="13" y="35" width="18" height="4" rx="2" fill="#e3a33b"/></svg>';

function defaults(){return{

function normalize(o){o=o||{};const d=defaults();
  if(Array.isArray(o.barberos)&&o.barberos.length>1&&Array.isArray(o.citas)){const id=o.barberos[0].id;o.citas.forEach(c=>{c.barberoId=id});o.barberos=[o.barberos[0]]}
  return{
  config:Object.assign({},d.config,o.config||{}),
  servicios:Array.isArray(o.servicios)&&o.servicios.length?o.servicios:d.servicios,
  barberos:Array.isArray(o.barberos)&&o.barberos.length?o.barberos:d.barberos,

/* ---------- guardado: este equipo + nube (si está disponible) ---------- */
let remote=null,dirty=new Set(),timer=null,saving=false;
function setSync(t){$('#hSync').textContent='Silla · '+t}
function touch(...keys){keys.forEach(k=>dirty.add(k));saveLocal();try{programarSync()}catch(e){}try{programarRespaldo()}catch(e){}if(remote){clearTimeout(timer);timer=setTimeout(flush,700)}}
function docBody(k){
  if(k==='config')return{config:S.config,servicios:S.servicios,barberos:S.barberos,v:1};
  const m=k.slice(4);return{citas:S.citas.filter(c=>c.fecha.slice(0,7)===m)};
}
async function flush(){
  if(!remote||saving)return;saving=true;setSync('guardando…');
  let k=null;
  try{
    while(dirty.size){k=[...dirty][0];dirty.delete(k);await remote.col.doc(k).set(docBody(k));k=null}
    setSync('guardado en la nube');
  }catch(e){
    if(k)dirty.add(k);
    const code=e&&e.code;
    if(code==='invalid_argument'||code==='revoked'||code==='not_granted'){remote=null;dirty.clear();setSync('guardado en este equipo')}
    else if(code==='quota_exceeded')setSync('sin espacio en la nube');
    else{setSync('sin conexión · guardado en este equipo');clearTimeout(timer);timer=setTimeout(flush,15000)}
  }
  saving=false;
  if(remote&&dirty.size&&!timer)timer=setTimeout(flush,700);
}
function applyRemote(docs){
  if(dirty.size||saving)return;
  let conf=null,citas=[];
  docs.forEach(d=>{const b=d.data();if(!b)return;if(d.id==='config')conf=b;else if(d.id.indexOf('mes-')===0&&Array.isArray(b.citas))citas=citas.concat(b.citas)});
  if(!conf&&!citas.length)return;
  S=normalize(JSON.parse(JSON.stringify(Object.assign({},conf||{},{citas}))));
  saveLocal();render();
}
async function initRemote(){
  try{
    if(!window.claude||typeof window.claude.use!=='function')return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const col=db.collection('data/users/'+id);
    const snap=await col.get();
    remote={col};
    if(snap.empty){touch('config',...new Set(S.citas.map(c=>mes(c.fecha))))}
    else{applyRemote(snap.docs);setSync('guardado en la nube')}
    col.onSnapshot(s=>{if(!s.metadata.hasPendingWrites)applyRemote(s.docs)},()=>{});
  }catch(e){remote=null}
}

const serv=id=>S.servicios.find(s=>s.id===id);
const barb=id=>S.barberos.find(b=>b.id===id);
function slots(){const out=[],a=toMin(S.config.inicio),b=toMin(S.config.fin),st=+S.config.intervalo||30;for(let t=a;t<b;t+=st)out.push(t);return out}
function almuerzo(){const d=+S.config.almDur||0;return d?{a:toMin(S.config.almIni||'14:00'),d}:null}
function enAlmuerzo(t,dur){const al=almuerzo();return!!al&&t<al.a+al.d&&al.a<t+(dur||1)}
function almHTML(){const c=S.config;return`<div class="grid2"><label>Hora de almuerzo<select data-cfg="almDur">${[[0,'Sin almuerzo'],[30,'30 minutos'],[60,'1 hora'],[90,'1 hora y media'],[120,'2 horas']].map(([v,t])=>`<option value="${v}" ${(+c.almDur||0)===v?'selected':''}>${t}</option>`).join('')}</select></label><label>Desde las<input type="time" data-cfg="almIni" value="${esc(c.almIni||'14:00')}" ${+c.almDur?'':'disabled'}></label></div>`}
function cargarLogo(file){
  if(!file)return;if(!/^image\//.test(file.type)){toast('Elige una imagen (PNG, JPG o WebP)');return}
  if(file.size>8e6){toast('La imagen es muy pesada (máx. 8 MB)');return}
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{
    const intento=(lado,q)=>{const cv=document.createElement('canvas');cv.width=cv.height=lado;const x=cv.getContext('2d');
      const k=Math.min(lado/img.width,lado/img.height),w=img.width*k,h=img.height*k;x.imageSmoothingQuality='high';x.drawImage(img,(lado-w)/2,(lado-h)/2,w,h);
      let d=cv.toDataURL('image/webp',q);if(!/^data:image\/webp/.test(d))d=cv.toDataURL('image/png');return d};
    let d='';for(const [l,q] of [[192,.86],[160,.8],[128,.75],[112,.65],[96,.6]]){d=intento(l,q);if(d.length<13000)break}
    URL.revokeObjectURL(url);
    if(d.length>=13000){toast('No pudimos achicar ese logo. Prueba con otra imagen');return}
    S.config.logo=d;touch('config');render();toast('¡Logo listo! Ya aparece en tu página de reservas')};
  img.onerror=()=>{URL.revokeObjectURL(url);toast('No pudimos leer esa imagen')};
  img.src=url}
function ocupados(f,bid,excepto){
  const set=new Set(),sl=slots();
  S.citas.forEach(c=>{
    if(c.fecha!==f||c.barberoId!==bid||c.id===excepto||c.estado==='novino')return;
    const a=toMin(c.hora),d=c.duracion||(serv(c.servicioId)||{}).duracion||30;
    sl.forEach(t=>{if(t>=a&&t<a+d)set.add(t)});
  });return set;
}
function normTel(t){let d=String(t||'').replace(/\D/g,'');if(!d)return'';if(d.indexOf('56')===0&&d.length>=11)return d;if(d.length===9)return'56'+d;if(d.length===8)return'569'+d;return d}
function mensaje(c){
  const s=c.servicio||(serv(c.servicioId)||{}).nombre||'';
  return(S.config.mensaje||'').replace(/\{cliente\}/g,(c.cliente||'').split(' ')[0]).replace(/\{barberia\}/g,S.config.nombre)
    .replace(/\{fecha\}/g,fechaLarga(c.fecha)).replace(/\{hora\}/g,c.hora).replace(/\{servicio\}/g,s).replace(/\{barbero\}/g,(barb(c.barberoId)||{}).nombre||'');
}
function waLink(tel,texto){const n=normTel(tel);if(!n)return'';return'https://wa.me/'+n+(texto?'?text='+encodeURIComponent(texto):'')}
function clientes(){
  const map={};
  [...S.citas].sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora)).forEach(c=>{
    const k=normTel(c.telefono)||('n:'+(c.cliente||'').trim().toLowerCase());if(!c.cliente)return;
    const o=map[k]||(map[k]={nombre:'',telefono:'',atendidos:0,novino:0,gasto:0,ultima:''});
    o.nombre=c.cliente;if(c.telefono)o.telefono=c.telefono;
    if(c.estado==='atendido'){o.atendidos++;o.gasto+=+c.precio||0;o.ultima=c.fecha}
    if(c.estado==='novino')o.novino++;
  });
  return Object.values(map).sort((a,b)=>(b.ultima||'').localeCompare(a.ultima||'')||a.nombre.localeCompare(b.nombre));
}

function citaCard(c){

function vAgenda(){
  const f=ui.fecha,bsel=ui.barbero==='todos'?null:ui.barbero,esHoy=f===hoy();
  if(bsel&&!barb(bsel))ui.barbero='todos';
  const dia=S.citas.filter(c=>c.fecha===f&&(!bsel||c.barberoId===bsel));
  const items=dia.map(c=>({t:toMin(c.hora),c}));
  const ahora=new Date(),minAhora=ahora.getHours()*60+ahora.getMinutes();
  if(f>=hoy()){
    const al=almuerzo();if(al&&(S.config.dias||[1,2,3,4,5,6]).indexOf(parse(f).getDay())>=0&&!(esHoy&&al.a+al.d<minAhora))items.push({t:al.a,alm:al});
    const occ={};S.barberos.forEach(b=>occ[b.id]=ocupados(f,b.id));
    slots().forEach(t=>{
      if(esHoy&&t<minAhora-(+S.config.intervalo||30))return;
      if(enAlmuerzo(t,+S.config.intervalo||30))return;
      const libre=bsel?!occ[bsel].has(t):S.barberos.some(b=>!occ[b.id].has(t));
      if(libre)items.push({t,libre:true});
    });
  }
  items.sort((a,b)=>a.t-b.t||(a.libre||a.alm?1:0)-(b.libre||b.alm?1:0));
  const activas=dia.filter(c=>c.estado!=='novino');
  const esperado=activas.reduce((s,c)=>s+(+c.precio||0),0);
  const hecho=dia.filter(c=>c.estado==='atendido').reduce((s,c)=>s+(+c.precio||0),0);
  let h=bannerPlan()+`<div class="daynav"><button class="arrow" data-act="dia" data-v="-1" aria-label="Día anterior">‹</button>
    <div class="mid"><strong>${esc(fechaLarga(f))}</strong><span>${esHoy?'Hoy':'Toca para elegir fecha · '+(f<hoy()?'pasado':'próximo')}</span><input type="date" class="pick" value="${f}" aria-label="Elegir fecha"></div>
    <button class="arrow" data-act="dia" data-v="1" aria-label="Día siguiente">›</button></div>`;
  if(!esHoy)h+=`<div class="chips"><button class="chip" data-act="dia" data-v="0">Volver a hoy</button>${f>hoy()?'<button class="chip" data-act="horas-libres">Compartir horas libres</button>':''}</div>`;
  else h+=`<div class="chips"><button class="chip" data-act="horas-libres">${ic('send')} Compartir horas libres</button></div>`;
  if(esHoy)h+=pubAvisoHTML()+resumenHoyHTML();
  const dias=S.config.dias||[1,2,3,4,5,6];
  if(dias.indexOf(parse(f).getDay())<0)h+=`<div class="cerrado">${ic('moon')}Día cerrado según tu horario. Igual puedes agendar a mano.</div>`;
  if(S.barberos.length>1){
    h+=`<div class="chips"><button class="chip ${ui.barbero==='todos'?'on':''}" data-act="barbero" data-v="todos">Todos</button>`+
      S.barberos.map(b=>`<button class="chip ${ui.barbero===b.id?'on':''}" data-act="barbero" data-v="${b.id}">${esc(b.nombre)}</button>`).join('')+`</div>`;
  }
  h+=`<div class="resumen"><div><b>${activas.length}</b><span>horas</span></div><div><b>${clp(esperado)}</b><span>esperado</span></div><div><b>${clp(hecho)}</b><span>cobrado</span></div></div>`;
  if(!S.citas.length)h+=`<div class="vacio"><div class="ico">${ic('scissors')}</div><b>¡Bienvenido a Silla!</b><br>Revisa tus servicios y precios en <b>Ajustes</b>, y después toca una hora libre o el botón <b>+</b> para agendar.</div>`;
  if(!items.length)h+=`<div class="vacio">${f<hoy()?'No hubo horas este día.':'No quedan horas libres en el horario de atención.'}</div>`;
  h+=items.map(it=>it.alm?`<div class="almuerzo"><span class="h">${toHH(it.alm.a)}</span>${ic('moon')}<b>Almuerzo</b><small>hasta las ${toHH(it.alm.a+it.alm.d)} · no se puede reservar</small></div>`:it.libre?`<button class="libre" data-act="nueva" data-hora="${toHH(it.t)}"><span class="h">${toHH(it.t)}</span>Libre<span class="plus">+</span></button>`:citaCard(it.c)).join('');
  return h;
}

function rango(){

  if(ui.rango==='hoy')return[t,t,'Hoy'];
  if(ui.rango==='semana'){const d=parse(t),w=(d.getDay()+6)%7,a=addDays(t,-w);return[a,addDays(a,6),'Esta semana']}
  const d=parse(t);return[ymd(new Date(d.getFullYear(),d.getMonth(),1)),ymd(new Date(d.getFullYear(),d.getMonth()+1,0)),'Este mes'];
}

/* ---------- plan y suscripción ---------- */
let L=(()=>{try{return JSON.parse(localStorage.getItem(LKEY))||{}}catch(e){return{}}})();
function saveL(){try{localStorage.setItem(LKEY,JSON.stringify(L))}catch(e){}}
if(!L.id){L.id='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);L.primera=hoy();saveL()}
const diasEntre=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
function plan(){
  const hasta=L.hasta||addDays(L.primera||hoy(),30),gracia=L.gracia!=null?+L.gracia:5,d=diasEntre(hoy(),hasta);
  let estado=L.estado==='pagado'&&d>=0?'pagado':(d>=0?'prueba':(d>=-gracia?'vencido':'bloqueado'));
  return{estado,hasta,dias:d,quedaGracia:gracia+d,precio:L.precio||4990,cobro:L.cobro||'',transferir:L.transferir||''};
}
let verificando=false;
async function verificar(manual){
  if(verificando)return;
  if(!S.config.registrado){if(manual)pedirRegistro();return}
  verificando=true;
  try{
    const q=new URLSearchParams({id:L.id,nombre:(S.barberos[0]||{}).nombre||'',barberia:S.config.nombre||'',whatsapp:S.config.whatsapp||'',correo:S.config.correo||'',v:VERSION_APP});
    const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),12000);
    const r=await fetch(API+'?'+q.toString(),{signal:ctl.signal});clearTimeout(t);
    const j=await r.json();
    if(j&&j.ok){Object.assign(L,{estado:j.estado,hasta:j.hasta,gracia:j.gracia,precio:j.precio,cobro:j.cobro,transferir:j.transferir,codigo:j.codigo||L.codigo,revisado:Date.now()});saveL();if(manual)toast(j.estado==='pagado'?'¡Plan activo! Gracias':'Plan revisado');sincronizar();pedirNuevas()}
  }catch(e){if(manual)toast('Sin conexión: inténtalo con internet')}
  verificando=false;render();
}
function avisarPago(pl){try{fetch(API+'?'+new URLSearchParams({accion:'aviso',id:L.id,m:pl.m,monto:pl.precio,barberia:S.config.nombre||'',nombre:(S.barberos[0]||{}).nombre||''}).toString()).catch(()=>{})}catch(e){}}
async function postAPI(o){const r=await fetch(API,{method:'POST',body:JSON.stringify(o)});return r.json()}
async function pagarPlan(m){
  if(!navigator.onLine){toast('Necesitas internet para pagar');return}
  const pl=planes().find(x=>x.m===m);toast('Abriendo Mercado Pago…');
  try{let j=await postAPI({accion:'checkout',id:L.id,meses:m});
    if(j.error==='sin-registro'){await verificar(false);j=await postAPI({accion:'checkout',id:L.id,meses:m})}
    if(j.ok&&j.url){L.pagoPend=Date.now();saveL();location.href=j.url;return}}catch(e){}
  avisarPago(pl);
  if(pl.link){window.open(pl.link,'_blank');return}
  const w=waCobro(pl);if(w){window.open(w,'_blank');return}
  toast('No se pudo abrir el pago, intenta de nuevo')}
async function enviarPago(){const el=$('#pgOp');const op=((el&&el.value)||'').replace(/\D/g,'');if(op.length<6){toast('Revisa el número de operación');return}toast('Revisando tu pago…');
  try{const j=await postAPI({accion:'pago',id:L.id,op});
    if(j.ok&&j.estado==='pagado'){L.estado='pagado';L.hasta=j.hasta;saveL();cerrar();render();pintarBloqueo();toast('¡Pago recibido! Plan activo')}
    else if(j.ok&&j.pendiente){cerrar();toast('Recibimos tu aviso. Activamos tu plan apenas lo revisemos')}
    else toast({usada:'Ese número de operación ya se usó','no-aprobado':'Ese pago todavía no está aprobado','no-encontrado':'No encontramos ese pago, revisa el número',monto:'El monto no alcanza para el plan',antiguo:'Ese pago es muy antiguo','sin-registro':'Completa tu registro primero'}[j.error]||'No se pudo revisar, intenta de nuevo')}
  catch(e){toast('Sin conexión, intenta de nuevo')}}
function revisarRetornoPago(){const q=new URLSearchParams(location.search).get('pago');if(!q)return;try{history.replaceState(null,'',location.pathname)}catch(e){}
  if(q==='error'){toast('El pago no se completó. Puedes intentarlo de nuevo');return}
  toast(q==='ok'?'¡Pago recibido! Activando tu plan…':'Tu pago está en revisión, te avisamos al activarse');let n=0;
  const t=setInterval(async()=>{n++;try{await verificar(false)}catch(e){}if(plan().estado==='pagado'||n>8){clearInterval(t);render();pintarBloqueo();if(plan().estado==='pagado')toast('¡Plan activo! Gracias por confiar en Silla')}},5000)}

async function respaldar(manual){
  if(!S.config.registrado){if(manual)toast('Completa tu registro primero');return}
  if(!navigator.onLine){if(manual)toast('Sin internet: se respalda solo cuando vuelva');return}
  if(!/@/.test(S.config.correo||'')){if(manual)toast('Agrega tu correo para activar el respaldo');return}
  try{const j=await postAPI({accion:'respaldo',id:L.id,correo:S.config.correo,datos:JSON.stringify(S)});
    if(j&&j.ok){L.respaldo=Date.now();saveL();if(manual){toast('Respaldo guardado en la nube');render()}}
    else if(manual)toast(j&&j.error==='sin-registro'?'Tu cuenta aún se está activando, intenta en un rato':'No se pudo respaldar')}
  catch(e){if(manual)toast('No se pudo respaldar, revisa tu internet')}}
function hace(t){if(!t)return'todavía no';const m=Math.round((Date.now()-t)/6e4);if(m<1)return'recién';if(m<60)return'hace '+m+' min';const h=Math.round(m/60);if(h<24)return'hace '+h+' h';const d=Math.round(h/24);return'hace '+d+' día'+(d===1?'':'s')}

    <label>Cliente<input name="cliente" list="lcli" required autocomplete="off" value="${esc(c.cliente||'')}" placeholder="Nombre"></label>
    <datalist id="lcli">${clientes().map(k=>`<option value="${esc(k.nombre)}">`).join('')}</datalist>
    <label>Teléfono (WhatsApp)<input name="telefono" type="tel" inputmode="tel" placeholder="9 1234 5678" value="${esc(c.telefono||'')}"></label>
    <label>Servicio<select name="servicioId">${sOpts}</select></label>
    ${S.barberos.length>1?`<label>Barbero<select name="barberoId">${bOpts}</select></label>`:`<input type="hidden" name="barberoId" value="${S.barberos[0].id}">`}
    <div class="grid2"><label>Fecha<input type="date" name="fecha" required value="${esc(c.fecha)}"></label><label>Hora<input type="time" name="hora" required step="300" value="${esc(c.hora)}"></label></div>
    <label>Nota<input name="nota" value="${esc(c.nota||'')}" placeholder="Ej: degradado bajo, trae a su hijo"></label>
    <p class="warn" id="aviso"></p>
    <div class="row">${nuevo?'':`<button type="button" class="btn danger" data-act="borrar-cita" data-id="${c.id}">Borrar</button>`}<button type="button" class="btn" data-act="cerrar">Cancelar</button><button class="btn pri" type="submit">Guardar</button></div></form>`);
}
function guardarCita(form){
  const fd=new FormData(form),v=k=>String(fd.get(k)||'').trim();
  const id=form.dataset.id,old=id?S.citas.find(c=>c.id===id):null;
  const s=serv(v('servicioId'))||S.servicios[0];
  const datos={cliente:v('cliente'),telefono:v('telefono'),servicioId:s.id,barberoId:v('barberoId')||S.barberos[0].id,fecha:v('fecha'),hora:v('hora'),nota:v('nota')};
  if(!datos.cliente||!datos.fecha||!datos.hora)return;
  const a=toMin(datos.hora),d=s.duracion||30;
  const choque=S.citas.find(c=>c.id!==id&&c.fecha===datos.fecha&&c.barberoId===datos.barberoId&&c.estado!=='novino'&&(()=>{const x=toMin(c.hora),y=x+(c.duracion||30);return a<y&&x<a+d})());
  if(choque&&form.dataset.forzar!=='1'){$('#aviso').textContent=`Choca con ${choque.cliente} a las ${choque.hora}. Toca Guardar otra vez para agendar igual.`;form.dataset.forzar='1';return}
  const keys=[mes(datos.fecha)];
  if(old){
    keys.push(mes(old.fecha));
    if(old.servicioId!==s.id||!old.servicio){datos.servicio=s.nombre;datos.precio=+s.precio||0;datos.duracion=d}
    Object.assign(old,datos);
  }else S.citas.push(Object.assign({id:uid(),estado:'pendiente',servicio:s.nombre,precio:+s.precio||0,duracion:d,creada:Date.now()},datos));
  touch(...new Set(keys));cerrar();ui.fecha=datos.fecha;ui.tab='agenda';render();toast(old?'Hora actualizada':'Hora agendada');
}

let tt=null;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),1800)}

document.addEventListener('click',e=>{
  if(e.target.id==='modal'){cerrar();return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=A[el.dataset.act];if(f){if(el.tagName!=='A')e.preventDefault();f(el)}
});

    if(!v('nombre')||!v('barberia')||normTel(v('whatsapp')).length<11){toast('Revisa tu WhatsApp (9 dígitos)');return}
    S.barberos[0].nombre=v('nombre');S.config.nombre=v('barberia');S.config.whatsapp=v('whatsapp');S.config.correo=v('correo');S.config.registrado=true;touch('config');cerrar();render();toast('¡Listo! Tu prueba gratis empezó');verificar(false)}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='buscar'){ui.buscar=el.value;pintarClientes()}
  if(el.name==='cliente'&&el.form&&el.form.id==='fcita'){const k=clientes().find(c=>c.nombre.toLowerCase()===el.value.trim().toLowerCase());const t=el.form.elements.telefono;if(k&&k.telefono&&!t.value)t.value=k.telefono}
  if(el.form&&el.form.id==='fcita'&&el.name!=='nota')el.form.dataset.forzar='';
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='logoFile'){cargarLogo(el.files&&el.files[0]);el.value='';return}
  if(el.id==='catFile'){agregarFotoCat(el.files&&el.files[0]);el.value='';return}
  if(el.classList.contains('pick')){ui.fecha=el.value||hoy();render();return}
  if(el.dataset.pub){const c=pubCfg(),k=el.dataset.pub;c[k]=el.value;S.config.pub=c;touch('config');guardarPubSW();toast('Guardado');if(k==='h'){L.pubAvisada='';saveL()}return}
  if(el.dataset.cfg){const k=el.dataset.cfg;let v=el.value;if(k==='intervalo'||k==='ant'||k==='meses'||k==='almDur')v=+v;if(k==='nombre'&&!v.trim())return;S.config[k]=v;touch('config');$('#hNombre').textContent=S.config.nombre;toast('Guardado');if(k==='whatsapp'||k==='almDur')render()}
  else if(el.dataset.sid){const s=serv(el.dataset.sid);if(!s)return;const k=el.dataset.k;s[k]=k==='nombre'?el.value.trim()||s.nombre:Math.max(0,+el.value||0);touch('config');toast('Guardado')}
  else if(el.dataset.bid){const b=barb(el.dataset.bid);if(b&&el.value.trim()){b.nombre=el.value.trim();touch('config');toast('Guardado')}}
});
