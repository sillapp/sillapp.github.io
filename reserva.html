<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Reserva tu hora</title>
<style>
:root{--bg:#121212;--card:#1c1c1f;--card2:#25252a;--line:#303036;--txt:#f3f3f3;--mut:#9b9ba4;--acc:#e3a33b;--acc2:#f0bd62;--ok:#3fb871}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(120px + env(safe-area-inset-bottom))}
.hero{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.hero svg{flex:none}
.hero h1{font-size:22px;line-height:1.2}
.hero p{color:var(--mut);font-size:14px;margin-top:2px}
h2{display:flex;align-items:center;gap:10px;font-size:16px;margin:22px 0 10px}
h2 span{width:26px;height:26px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--acc2)}
h2.ok span{background:var(--acc);color:#1a1a1a;border-color:var(--acc)}
.serv{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px;cursor:pointer}
.serv b{display:block}
.serv small{color:var(--mut);font-size:13px}
.serv .p{margin-left:auto;font-weight:700;color:var(--acc2)}
.on{border-color:var(--acc)!important;background:rgba(227,163,59,.12)!important}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chip{flex:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 13px;cursor:pointer;text-align:center;min-width:62px}
.chip small{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.chip b{font-size:17px}
.horas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.horas button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 0;cursor:pointer;font-variant-numeric:tabular-nums}
.nada{color:var(--mut);font-size:14px;padding:6px 2px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:10px}
input{display:block;width:100%;margin-top:4px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px}
input:focus{outline:2px solid var(--acc);outline-offset:-1px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(18,18,18,.97);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:560px;margin:0 auto}
.res{font-size:13px;color:var(--mut);margin-bottom:8px;min-height:18px}
.res b{color:var(--txt)}
.send{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;border-radius:13px;background:#25d366;color:#0b2e17;font-weight:700;font-size:16px;text-decoration:none;border:0}
.send.off{background:var(--card2);color:var(--mut);pointer-events:none}
.okbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center;margin-top:30px;line-height:1.5}
.okbox h1{font-size:21px;margin:12px 0 6px}
.okbox p{color:var(--mut)}
.okbox button{margin-top:16px;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px 18px;cursor:pointer}
.nota{font-size:13px;color:var(--mut);margin-top:14px;line-height:1.45}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="bar" id="bar" style="display:none"><div class="in"><div class="res" id="res"></div><a class="send off" id="send" href="#" target="_blank" rel="noopener"></a></div></div>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const toMin=h=>{const[a,b]=(h||'0:0').split(':').map(Number);return a*60+(b||0)};
const toHH=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const clp=n=>'$'+Math.round(n||0).toLocaleString('es-CL');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hex=s=>Array.from(new TextEncoder().encode(s)).map(b=>b.toString(16).padStart(2,'0')).join('');
const unhex=h=>new TextDecoder().decode(new Uint8Array((h.match(/../g)||[]).map(x=>parseInt(x,16))));
const fechaLarga=s=>parse(s).toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'});
const IC={
  pole:'<svg width="44" height="44" viewBox="0 0 44 44"><defs><clipPath id="pc"><rect x="15" y="8" width="14" height="28" rx="3"/></clipPath></defs><rect width="44" height="44" rx="12" fill="#1c1c1f" stroke="#303036"/><g clip-path="url(#pc)"><rect x="15" y="8" width="14" height="28" fill="#f3f3f3"/><g stroke-width="5"><path d="M8 18 36 4M8 30 36 16M8 42 36 28" stroke="#e5534b"/><path d="M8 24 36 10M8 36 36 22" stroke="#4a9eff"/></g></g><rect x="13" y="5" width="18" height="4" rx="2" fill="#e3a33b"/><rect x="13" y="35" width="18" height="4" rx="2" fill="#e3a33b"/></svg>',
  wa:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4A8 8 0 1 1 20 11.5z"/><path d="M9 9.5c.3 1.8 1.7 3.6 3.6 4.6l1.1-1 1.8.8"/></svg>',
  check:'<svg width="48" height="48" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="22" fill="rgba(63,184,113,.15)" stroke="#3fb871" stroke-width="2"/><path d="M14 25l7 7 13-15" stroke="#3fb871" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};

let C=null;
try{const h=location.hash||'';if(h.indexOf('#c-')===0)C=JSON.parse(unhex(h.slice(3)))}catch(e){C=null}
if(!C||!C.n||!Array.isArray(C.s)||!C.s.length){
  $('#app').innerHTML=`<div class="okbox">${IC.pole}<h1>Enlace incompleto</h1><p>Pídele a la barbería su enlace de reservas actualizado.</p></div>`;return;
}
document.title='Reserva tu hora · '+C.n;
const dias=Array.isArray(C.d)&&C.d.length?C.d:[1,2,3,4,5,6];
const st=+C.v||30;
let sel={s:null,b:(C.b&&C.b.length===1)?0:null,f:null,h:null,nombre:'',tel:''};
let enviado=false;

function proximosDias(){const out=[],d=new Date();for(let i=0;out.length<14&&i<45;i++){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+i);if(dias.indexOf(x.getDay())>=0)out.push(ymd(x))}return out}
function horasDe(f){
  const s=C.s[sel.s];if(!s)return[];
  const dur=+s[2]||30,a=toMin(C.i||'10:00'),b=toMin(C.f||'20:00'),out=[];
  const now=new Date(),esHoy=f===ymd(now),mn=now.getHours()*60+now.getMinutes()+30;
  for(let t=a;t+dur<=b;t+=st){if(esHoy&&t<mn)continue;out.push(toHH(t))}
  return out;
}
function render(){
  if(enviado){$('#bar').style.display='none';
    $('#app').innerHTML=`<div class="okbox">${IC.check}<h1>¡Solicitud lista!</h1><p>Envía el mensaje en WhatsApp. ${esc(C.n)} te confirmará la hora por ahí.</p>${C.w?`<p style="margin-top:10px">Si WhatsApp no se abrió, escribe al <b style="color:var(--txt)">+${esc(C.w)}</b>.</p>`:''}<button id="otra">Hacer otra reserva</button></div>`;return}
  const multiB=C.b&&C.b.length>1;
  let h=`<div class="hero">${IC.pole}<div><h1>${esc(C.n)}</h1><p>${C.b&&C.b.length===1&&C.b[0]&&C.b[0]!=='Barbero 1'?'Reserva tu hora con '+esc(C.b[0]):'Reserva tu hora en un minuto'}</p></div></div>`;
  h+=`<h2 class="${sel.s!=null?'ok':''}"><span>1</span>Elige el servicio</h2>`+C.s.map((s,i)=>`<button class="serv ${sel.s===i?'on':''}" data-s="${i}"><div><b>${esc(s[0])}</b><small>${+s[2]||30} min</small></div><span class="p">${clp(s[1])}</span></button>`).join('');
  let n=2;
  if(multiB){h+=`<h2 class="${sel.b!=null?'ok':''}"><span>${n++}</span>¿Con quién?</h2><div class="chips">`+C.b.map((b,i)=>`<button class="chip ${sel.b===i?'on':''}" data-b="${i}"><b style="font-size:15px">${esc(b)}</b></button>`).join('')+`</div>`}
  h+=`<h2 class="${sel.f?'ok':''}"><span>${n++}</span>Elige el día</h2><div class="chips">`+proximosDias().map(f=>{const d=parse(f);return`<button class="chip ${sel.f===f?'on':''}" data-f="${f}"><small>${d.toLocaleDateString('es-CL',{weekday:'short'}).replace('.','')}</small><b>${d.getDate()}</b><small>${d.toLocaleDateString('es-CL',{month:'short'}).replace('.','')}</small></button>`}).join('')+`</div>`;
  h+=`<h2 class="${sel.h?'ok':''}"><span>${n++}</span>Elige la hora</h2>`;
  if(sel.s==null||!sel.f)h+=`<p class="nada">Primero elige el servicio y el día.</p>`;
  else{const hs=horasDe(sel.f);h+=hs.length?`<div class="horas">${hs.map(x=>`<button class="${sel.h===x?'on':''}" data-h="${x}">${x}</button>`).join('')}</div>`:`<p class="nada">No quedan horas este día. Prueba con otro.</p>`}
  h+=`<h2 class="${sel.nombre&&sel.tel?'ok':''}"><span>${n++}</span>Tus datos</h2>
    <label>Nombre<input id="nom" autocomplete="name" value="${esc(sel.nombre)}" placeholder="Tu nombre"></label>
    <label>Teléfono<input id="tel" type="tel" inputmode="tel" autocomplete="tel" value="${esc(sel.tel)}" placeholder="9 1234 5678"></label>
    <p class="nota">Tu solicitud se envía por WhatsApp y la barbería te confirma la hora. Si ese horario ya está tomado, te propondrán otro.</p>`;
  $('#app').innerHTML=h;
  actualizarBarra();
}
function actualizarBarra(){
  $('#bar').style.display='';
  const s=C.s[sel.s],listo=s&&sel.f&&sel.h&&(!C.b||C.b.length<2||sel.b!=null)&&sel.nombre.trim().length>1&&sel.tel.replace(/\D/g,'').length>=8;
  $('#res').innerHTML=s&&sel.f&&sel.h?`<b>${esc(s[0])}</b> · ${esc(fechaLarga(sel.f))} · <b>${sel.h}</b>`:'Completa los pasos para reservar';
  const a=$('#send');a.innerHTML=IC.wa+' Enviar solicitud';
  if(!listo||!C.w){a.classList.add('off');a.href='#';if(!C.w&&listo)$('#res').textContent='La barbería aún no configura su WhatsApp.';return}
  const barbero=C.b&&C.b.length?C.b[sel.b||0]:'';
  const req={i:Date.now().toString(36)+Math.random().toString(36).slice(2,6),c:sel.nombre.trim(),t:sel.tel.trim(),s:s[0],p:+s[1]||0,m:+s[2]||30,b:barbero,f:sel.f,h:sel.h};
  let txt=`Hola, quiero reservar una hora en ${C.n}:\n• Servicio: ${s[0]} (${clp(s[1])})\n• Día: ${fechaLarga(sel.f)}\n• Hora: ${sel.h}\n`+(C.b&&C.b.length>1?`• Barbero: ${barbero}\n`:'')+`• Nombre: ${req.c}\n• Teléfono: ${req.t}`;
  if(C.u)txt+=`\n\nAgendar en Silla: ${C.u}#r-${hex(JSON.stringify(req))}`;
  a.classList.remove('off');a.href='https://wa.me/'+C.w+'?text='+encodeURIComponent(txt);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a');if(!t)return;
  if(t.id==='send'){if(t.classList.contains('off')){e.preventDefault();return}setTimeout(()=>{enviado=true;render();window.scrollTo(0,0)},400);return}
  if(t.id==='otra'){enviado=false;sel.h=null;render();return}
  if(t.dataset.s!=null){sel.s=+t.dataset.s;sel.h=null}
  else if(t.dataset.b!=null)sel.b=+t.dataset.b;
  else if(t.dataset.f){sel.f=t.dataset.f;sel.h=null}
  else if(t.dataset.h)sel.h=t.dataset.h;
  else return;
  render();
});
document.addEventListener('input',e=>{if(e.target.id==='nom')sel.nombre=e.target.value;if(e.target.id==='tel')sel.tel=e.target.value;actualizarBarra()});
render();
})();
</script>
</body>
</html>
